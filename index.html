<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine Rupali chowdhary... 💖</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 300px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 12px 25px;
      margin: 10px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .no {
      background: #adb5bd;
      color: white;
    }

    .result {
      margin-top: 25px;
      font-size: 28px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Will you be my Valentine Rupali chowdhary..? 💌</h3>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="no" onclick="sayNo()">No 💔</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    function sayYes() {
      document.getElementById("result").innerHTML =
        "Yaaay! 🥰😊💞";
    }

    function sayNo() {
      document.getElementById("result").innerHTML =
        "Oh no... 😭💔";
    }
  </script>

</body>
</html>
